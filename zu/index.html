<!DOCTYPE html>
<html>

<head>
    <style>
        .left {
            position: absolute;
            top: 50%;
        }
        .right {
            position: absolute;
            top: 50%;
            right: 0%; 
        }
        button {
            font-size: large;
            width: 40px;
            height: 40px;
            background-color: rgba(17, 15, 15, 0.2);
            border: 0cap;
            cursor: pointer;
        }
        button:hover {
            background-color: rgba(17, 15, 15, 0.8);
            font-size: larger;
            transform: scaleY(1.5);
            color: white;
        }

        ul {
            list-style: none;
            position: relative;
            width: 1000px;
            height: 600px;
            overflow: hidden;
        }

        li {
            width: 100%;
            height: 100%;
            opacity: 0;
        }
        ul .active {
            opacity: 1;
        }
    </style>

</head>

<body>
    <ul>
        <button class="left"><</button>
        <button class="right">></button>
        <li class="pic active"><img src="img1.jpg" alt=""></li>
        <li class="pic"><img src="img2.jpg" alt=""></li>
        <li class="pic"><img src="img3.jpg" alt=""></li>
        <li class="pic"><img src="img4.jpg" alt=""></li>
        <li class="pic"><img src="img5.jpg" alt=""></li>
    </ul>

</body>

</html>
