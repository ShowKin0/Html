<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片轮换</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #162447 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .slider-container {
            position: relative;
            width: 1000px;
            height: 600px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.08),
                inset 0 0 80px rgba(255, 255, 255, 0.03);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(1.1);
            filter: brightness(0.7);
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            filter: brightness(1);
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, 
                rgba(0, 0, 0, 0.85) 0%, 
                rgba(0, 0, 0, 0.4) 50%, 
                transparent 100%);
            pointer-events: none;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            opacity: 0;
        }

        .slider-container:hover .nav-arrow {
            opacity: 1;
        }

        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-50%) scale(1.15);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .nav-arrow.prev { left: 24px; }
        .nav-arrow.next { right: 24px; }

        .nav-arrow .material-icons {
            color: white;
            font-size: 32px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .indicators {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 10;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .indicator:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.2);
        }

        .indicator.active {
            background: white;
            transform: scale(1.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .slide-counter {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
        }

        .title-overlay {
            position: absolute;
            bottom: 80px;
            left: 40px;
            color: white;
            z-index: 10;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .slide.active .title-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .slide.active .title-overlay h2 {
            transition-delay: 0.2s;
        }

        .slide.active .title-overlay p {
            transition-delay: 0.35s;
        }

        .title-overlay h2 {
            font-size: 36px;
            font-weight: 700;
            text-shadow: 0 3px 20px rgba(0,0,0,0.6);
            margin-bottom: 8px;
            letter-spacing: 2px;
            transition: all 0.6s ease;
            transform: translateY(20px);
            opacity: 0;
        }

        .slide.active .title-overlay h2 {
            transform: translateY(0);
            opacity: 1;
        }

        .title-overlay p {
            font-size: 16px;
            opacity: 0;
            transition: all 0.6s ease;
            font-weight: 300;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        .slide.active .title-overlay p {
            opacity: 0.8;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            transition: width 0.1s linear;
            z-index: 10;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .slider-container {
            animation: fadeInUp 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-effect {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            padding: 12px 24px;
            border-radius: 30px;
            color: white;
            font-size: 13px;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="slider-container">
<div class="slide active">
            <img src="img1.jpg" alt="Mountain">
            <div class="slide-overlay"></div>
            <div class="title-overlay">
                <h2>山脉风光</h2>
                <p>探索大自然的壮美</p>
            </div>
        </div>
        <div class="slide">
            <img src="img2.jpg" alt="Ocean">
            <div class="slide-overlay"></div>
            <div class="title-overlay">
                <h2>海洋浩瀚</h2>
                <p>感受深邃与宁静</p>
            </div>
        </div>
        <div class="slide">
            <img src="img3.jpg" alt="Sunset">
            <div class="slide-overlay"></div>
            <div class="title-overlay">
                <h2>日落余晖</h2>
                <p>记录金色时刻</p>
            </div>
        </div>
        <div class="slide">
            <img src="img4.jpg" alt="Forest">
            <div class="slide-overlay"></div>
            <div class="title-overlay">
                <h2>森林秘径</h2>
                <p>沉浸绿色世界</p>
            </div>
        </div>
        <div class="slide">
            <img src="img5.jpg" alt="City">
            <div class="slide-overlay"></div>
            <div class="title-overlay">
                <h2>城市夜景</h2>
                <p>霓虹与星空</p>
            </div>
        </div>

        <div class="glass-effect">Gallery</div>

        <div class="nav-arrow prev" onclick="changeSlide(-1)">
            <span class="material-icons">chevron_left</span>
        </div>
        <div class="nav-arrow next" onclick="changeSlide(1)">
            <span class="material-icons">chevron_right</span>
        </div>

        <div class="indicators" id="indicators"></div>

        <div class="slide-counter">
            <span id="currentIndex">01</span> / <span id="totalSlides">05</span>
        </div>

        <div class="progress-bar" id="progressBar"></div>
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        const indicatorsContainer = document.getElementById('indicators');
        const currentIndexEl = document.getElementById('currentIndex');
        const totalSlidesEl = document.getElementById('totalSlides');
        const progressBar = document.getElementById('progressBar');
        
        let currentSlide = 0;
        let autoPlayInterval;
        let progressInterval;
        let progress = 0;
        const autoPlayTime = 5000;

        totalSlidesEl.textContent = String(slides.length).padStart(2, '0');

        // 创建指示器
        slides.forEach((_, index) => {
            const indicator = document.createElement('div');
            indicator.className = `indicator ${index === 0 ? 'active' : ''}`;
            indicator.onclick = () => goToSlide(index);
            indicatorsContainer.appendChild(indicator);
        });

        const indicators = document.querySelectorAll('.indicator');

        function updateSlides() {
            slides.forEach((slide, index) => {
                slide.classList.toggle('active', index === currentSlide);
            });
            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentSlide);
            });
            currentIndexEl.textContent = String(currentSlide + 1).padStart(2, '0');
            
            // 重置进度条
            progress = 0;
            progressBar.style.width = '0%';
        }

        function changeSlide(direction) {
            currentSlide = (currentSlide + direction + slides.length) % slides.length;
            updateSlides();
            resetAutoPlay();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlides();
            resetAutoPlay();
        }

        function startProgressBar() {
            progress = 0;
            const startTime = Date.now();
            
            progressInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                progress = (elapsed / autoPlayTime) * 100;
                progressBar.style.width = Math.min(progress, 100) + '%';
            }, 50);
        }

function stopAutoPlay() {
            clearInterval(autoPlayInterval);
            clearInterval(progressInterval);
        }

        function startAutoPlay() {
            startProgressBar();
            autoPlayInterval = setInterval(() => {
                changeSlide(1);
            }, autoPlayTime);
        }

        function resetAutoPlay() {
            stopAutoPlay();
            startAutoPlay();
        }

        // 鼠标悬浮停止/恢复自动播放
        document.querySelectorAll('.nav-arrow').forEach(arrow => {
            arrow.addEventListener('mouseenter', stopAutoPlay);
            arrow.addEventListener('mouseleave', startAutoPlay);
        });

        document.querySelectorAll('.indicator').forEach(ind => {
            ind.addEventListener('mouseenter', stopAutoPlay);
            ind.addEventListener('mouseleave', startAutoPlay);
        });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });

        // 触摸滑动支持
        let touchStartX = 0;
        let touchEndX = 0;

        document.querySelector('.slider-container').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.querySelector('.slider-container').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    changeSlide(1);
                } else {
                    changeSlide(-1);
                }
            }
        }

        startAutoPlay();
    </script>
</body>
</html>
