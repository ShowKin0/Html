<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - SK的小站</title>
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
    <header>
        <h1>SK的小站 · 后台管理</h1>
        <a href="../index.html" class="back-link">← 返回前台</a>
    </header>

    <div class="admin-container">
        <!-- 发布文章 -->
        <section class="panel">
            <h2>发布新文章</h2>
            <form id="articleForm">
                <div class="form-group">
                    <label for="title">文章标题</label>
                    <input type="text" id="title" required placeholder="输入文章标题">
                </div>
                <div class="form-group">
                    <label for="summary">文章简介</label>
                    <textarea id="summary" rows="3" required placeholder="简短介绍文章内容"></textarea>
                </div>
                <div class="form-group">
                    <label>文章内容</label>
                    <div class="editor-toolbar" id="editorToolbar">
                        <button type="button" data-cmd="bold" title="粗体"><strong>B</strong></button>
                        <button type="button" data-cmd="italic" title="斜体"><em>I</em></button>
                        <button type="button" data-cmd="underline" title="下划线"><u>U</u></button>
                        <span class="tb-sep"></span>
                        <button type="button" data-cmd="h1" title="标题1">H1</button>
                        <button type="button" data-cmd="h2" title="标题2">H2</button>
                        <button type="button" data-cmd="h3" title="标题3">H3</button>
                        <span class="tb-sep"></span>
                        <button type="button" data-cmd="image" title="插入图片">🖼</button>
                        <button type="button" data-cmd="audio" title="插入音频">🔊</button>
                        <button type="button" data-cmd="link" title="插入链接">🔗</button>
                        <button type="button" data-cmd="file" title="插入文件">📎</button>
                        <span class="tb-sep"></span>
                        <button type="button" data-cmd="quote" title="引用">❝</button>
                        <button type="button" data-cmd="code" title="代码">&lt;/&gt;</button>
                        <button type="button" data-cmd="ul" title="无序列表">≡</button>
                    </div>
                    <!-- 隐藏的文件选择器 -->
                    <input type="file" id="filePicker" accept="image/*" multiple style="display:none">
                    <input type="file" id="audioPicker" accept="audio/*" style="display:none">
                    <input type="file" id="fileAttachPicker" style="display:none">
                    <!-- 可编辑区域 -->
                    <div class="editor-content" id="editorContent" contenteditable="true" data-placeholder="在这里写文章内容..."></div>
                    <!-- 隐藏的 textarea，用于表单提交 -->
                    <textarea id="content" style="display:none"></textarea>
                </div>
                <div class="form-group">
                    <label for="date">发布日期</label>
                    <input type="date" id="date">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">发布文章</button>
                    <button type="reset" class="btn-secondary">清空</button>
                </div>
            </form>
        </section>

        <!-- 文章列表 -->
        <section class="panel">
            <h2>已发布文章</h2>
            <div id="articleList">
                <p class="empty-tip">暂无文章</p>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
