<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SK的小站</title>
        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
        <link rel="icon" href="../Avatar.jpg" type="image/jpeg">
    </head>
    <body>
        <nav>
            <button class="navActive" data-tab="work">项目</button>
            <button data-tab="learn">学习</button>
            <button data-tab="explore">探索</button>
            <button data-tab="other">其它</button>
        </nav>
        <a href="admin/admin.html" class="admin-corner" target="_blank" onclick="if(!sessionStorage.getItem('sk_admin_auth')&&prompt('请输入管理密码：')!=='zhang')return false">后台</a>
        <main>
            <section class="content visible" id="work">
                <div class="work">
                    <ul>
                        <li>Html
                            <a href="work/his/hisIndex.html">His</a>
                            <a href="zu/index.html">imageChange</a>
                            <a href="work/Xiaomi/index.html">Xiaomi</a>
                        </li>
                        <li>Java
                            <a href="https://github.com/ShowKin0/JAVA">SRC</a>
                        </li>
                        <li>Godot</li>
                        <li>C++</li>
                        <li>AI Agent</li>
                    </ul>
                </div>
            </section>
            <section class="content" id="learn">
                <div class="learn">
                    <div class="learn-header">
                        <div class="learn-search">
                            <input type="text" id="searchArticle" placeholder="搜索文章...">
                        </div>
                    </div>
                    <div class="article-grid" id="articleGrid"></div>
                    <div class="article-empty" id="articleEmpty">
                        <p>暂无文章</p>
                    </div>
                </div>
            </section>
            <section class="content" id="explore"></section>
            <section class="content" id="other">
                <div class="other">
                    
                </div>
            </section>
        </main>
        <div class="music">
            <span class="musicName">unicorn Phantom - 独角</span>
            <button id="playMusic">播放</button>
            <audio id="music">
                <source src="work/UnicornPhantom - 独角.mp3" type="audio/mpeg">
            </audio>
        </div>

        <!-- 文章详情弹窗 -->
        <div class="modal-overlay" id="articleModal">
            <div class="modal-content">
                <button class="modal-close" id="modalClose">&times;</button>
                <h2 id="modalTitle"></h2>
                <div class="modal-meta" id="modalMeta"></div>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 SK的小站. All rights reserved.</p>
            <p>GitHub: <a href="https://github.com/ShowKin0" target="_blank" rel="noopener">ShowKin</a></p>
            <p><a href="https://github.com/ShowKin0/Html.git" target="_blank" rel="noopener">网站项目源码</a></p>
        </footer>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="index.js" defer></script>
    </body>
</html>
