<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的故事 💕</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <!-- 浮动背景粒子 -->
  <div class="particles" id="particles"></div>

  <!-- 顶部导航 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#hero" class="nav-brand">💕 我们的故事</a>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        <li><a href="#hero" data-nav>首页</a></li>
        <li><a href="#timeline" data-nav>时间线</a></li>
        <li><a href="#diary" data-nav>日记</a></li>
        <li><a href="#photos" data-nav>照片墙</a></li>
        <li><a href="#chat" data-nav>AI 聊天</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero 区域 -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <div class="hero-avatars">
        <div class="avatar avatar-left">👦</div>
        <div class="heart-beat">💖</div>
        <div class="avatar avatar-right">👧</div>
      </div>
      <h1 class="hero-title">我们的故事</h1>
      <p class="hero-subtitle">记录属于我们的每一个甜蜜瞬间</p>
      <div class="clock" id="clock">
        <div class="clock-date" id="clockDate"></div>
        <div class="clock-time" id="clockTime"></div>
      </div>
    </div>
    <div class="hero-floating">
      <span class="float-heart" style="left:10%;animation-delay:0s">💕</span>
      <span class="float-heart" style="left:25%;animation-delay:1.5s">🌸</span>
      <span class="float-heart" style="left:40%;animation-delay:3s">💗</span>
      <span class="float-heart" style="left:55%;animation-delay:0.8s">✨</span>
      <span class="float-heart" style="left:70%;animation-delay:2.2s">💖</span>
      <span class="float-heart" style="left:85%;animation-delay:3.8s">🌸</span>
    </div>
  </section>

  <!-- 时间线 -->
  <section class="section timeline-section" id="timeline">
    <h2 class="section-title">📅 我们的时间线</h2>
    <div class="timeline-add">
      <input type="date" id="tlDate" class="input" placeholder="日期">
      <input type="text" id="tlTitle" class="input" placeholder="事件标题">
      <input type="text" id="tlDesc" class="input" placeholder="简短描述（可选）">
      <button class="btn btn-pink" id="tlAddBtn">➕ 添加纪念日</button>
    </div>
    <div class="timeline" id="timelineContainer"></div>
  </section>

  <!-- 双人日记 -->
  <section class="section diary-section" id="diary">
    <h2 class="section-title">📖 我们的日记</h2>
    <div class="diary-dual">
      <!-- 他的日记 -->
      <div class="diary-panel diary-his">
        <h3 class="diary-name">💙 他的日记</h3>
        <div class="diary-form">
          <textarea id="diaryHisInput" class="input diary-input" placeholder="今天想说什么..."></textarea>
          <button class="btn btn-blue" id="diaryHisAdd">📝 写下心情</button>
        </div>
        <div class="diary-list" id="diaryHisList"></div>
      </div>
      <!-- 她的日记 -->
      <div class="diary-panel diary-her">
        <h3 class="diary-name">💗 她的日记</h3>
        <div class="diary-form">
          <textarea id="diaryHerInput" class="input diary-input" placeholder="今天想说什么..."></textarea>
          <button class="btn btn-pink" id="diaryHerAdd">📝 写下心情</button>
        </div>
        <div class="diary-list" id="diaryHerList"></div>
      </div>
    </div>
  </section>

  <!-- 照片墙 -->
  <section class="section photos-section" id="photos">
    <h2 class="section-title">📷 照片墙</h2>
    <div class="photo-upload">
      <label class="btn btn-pink upload-label">
        📸 上传照片
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
      </label>
    </div>
    <div class="photo-grid" id="photoGrid"></div>
  </section>

  <!-- AI 聊天 -->
  <section class="section chat-section" id="chat">
    <h2 class="section-title">🤖 AI 小助手</h2>
    <p class="chat-hint">为你们的感情问题提供温暖的建议（接口预留）</p>
    <div class="chat-box" id="chatBox">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-msg bot">你好呀！我是你们的小助手 💕 有什么我可以帮忙的吗？</div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" class="input" placeholder="输入消息...">
        <button class="btn btn-pink" id="chatSend">发送</button>
      </div>
    </div>
  </section>

  <!-- 照片预览弹窗 -->
  <div class="modal" id="photoModal">
    <span class="modal-close" id="modalClose">&times;</span>
    <img class="modal-img" id="modalImg" src="" alt="预览">
    <button class="btn btn-danger modal-del" id="modalDel">🗑 删除</button>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <p>Made with 💖 — 2026 我们的故事</p>
  </footer>

  <script src="index.js"></script>
</body>
</html>
